<!DOCTYPE html>
<!-- M7 验收 fixture:表格样式(T3)——边框/表头底色/列宽/单元格内边距(F4/AC5) -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>body { font-family: "宋体", serif; }</style>
</head>
<body>
  <h1>采购清单</h1>
  <table border="1px solid #333333">
    <thead>
      <tr>
        <th width="120" style="background: #DCE9F9">物料</th>
        <th width="90" style="background: #DCE9F9">数量</th>
        <th width="160" style="background: #DCE9F9">单价</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="padding: 6px">控制板</td>
        <td style="padding: 6px; text-align: center">12</td>
        <td style="padding: 6px">¥328.00</td>
      </tr>
      <tr>
        <td style="padding: 6px">传感器</td>
        <td style="padding: 6px; text-align: center">40</td>
        <td style="padding: 6px">¥56.50</td>
      </tr>
    </tbody>
  </table>
  <p>表格外正文。</p>
</body>
</html>
